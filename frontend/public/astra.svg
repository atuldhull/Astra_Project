<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background circle (matches app theme #0a0f14) -->
  <circle cx="32" cy="32" r="30" fill="#0a0f14" stroke="#ff7a1a" stroke-width="2"/>

  <!-- Radar sweep lines (orange accent) -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#ff7a1a" stroke-width="1" opacity="0.35"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#ff7a1a" stroke-width="1" opacity="0.35"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ff7a1a" stroke-width="0.75" opacity="0.35"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#ff7a1a" stroke-width="0.75" opacity="0.35"/>

  <!-- Central target reticle -->
  <circle cx="32" cy="32" r="3" fill="#ff7a1a"/>
  <circle cx="32" cy="32" r="5" fill="none" stroke="#ff7a1a" stroke-width="1.5"/>

  <!-- Detected objects (little dots around the center) -->
  <circle cx="20" cy="22" r="2" fill="#4ade80"/>
  <circle cx="44" cy="18" r="2" fill="#60a5fa"/>
  <circle cx="48" cy="42" r="2" fill="#facc15"/>
  <circle cx="16" cy="44" r="2" fill="#22d3ee"/>

  <!-- Sweep beam -->
  <path d="M 32 32 L 52 20 A 24 24 0 0 0 32 8 Z" fill="#ff7a1a" opacity="0.12"/>
</svg>
