name: ASTRA CI

# Runs on every push + PR to main. Three light jobs:
#   1) frontend lint + tsc + build
#   2) backend smoke (Python import, schema construction, hash chain unit)
#   3) federated synthetic smoke (1 round, 2 honest clients, no GPU)
#
# We deliberately DO NOT run the full e2e_regression here because that needs
# a running backend + GPU + trained YOLO weights. The smoke jobs catch the
# regressions that matter (broken imports, schema drift, broken hash chain).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Frontend ────────────────────────────────────────────────────────
  frontend:
    name: frontend · tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # ── Backend smoke ───────────────────────────────────────────────────
  backend:
    name: backend · imports + hash chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install minimal deps
        run: |
          python -m pip install --upgrade pip
          # Pin a minimal install — we don't need ultralytics/torch in CI for
          # import + hash chain unit tests.
          pip install fastapi pydantic-settings sqlalchemy psycopg2-binary \
                      python-multipart httpx numpy opencv-python-headless reportlab pillow
      - name: backend imports
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          cd backend
          python -c "import app.main; print('main OK')"
          python -c "from app.services.audit import _row_hash, GENESIS_HASH; \
                     h = _row_hash(GENESIS_HASH, {'a':1}); \
                     assert len(h) == 64; print('hash chain OK')"
          python -c "from federated.foolsgold import compute_aggregation_weights, FoolsGoldState; \
                     import numpy as np; \
                     s = FoolsGoldState(); \
                     w, d = compute_aggregation_weights({'a': np.ones(10), 'b': np.ones(10)}, s); \
                     print('foolsgold OK:', w)"
        continue-on-error: false

  # ── Federated synthetic ──────────────────────────────────────────────
  federated:
    name: federated · synthetic 1 round
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: 1-round synthetic smoke
        run: |
          python -m federated.run_demo --task synthetic --rounds 1 --device cpu
