; GNSS-SDR: GPS L1 C/A from the shrunk Jammertest recordings (int8 I/Q, 3.83625 MS/s).
; Run (Docker):  docker run --rm -v D:/astra/runs/jammertest:/data carlesfernandez/docker-gnsssdr \
;                  gnss-sdr --config_file=/data/gnss-sdr.conf --signal_source=/data/NAME_3836k_ibyte.iq
[GNSS-SDR]
GNSS-SDR.internal_fs_sps=3836250

SignalSource.implementation=File_Signal_Source
SignalSource.filename=/data/in.iq
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=3836250
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.enable_throttle_control=false

SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ibyte_To_Complex
InputFilter.implementation=Pass_Through
InputFilter.item_type=gr_complex
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex

Channels_1C.count=12
Channels.in_acquisition=1
Channel.signal=1C

Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=250
Acquisition_1C.max_dwells=2

Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=35.0
Tracking_1C.dll_bw_hz=2.0
Tracking_1C.early_late_space_chips=0.5

TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder

Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=/data/out/observables.dat

PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=200
PVT.display_rate_ms=10000
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_path=/data/out
PVT.nmea_dump_filename=/data/out/pvt.nmea
PVT.flag_nmea_tty_port=false
PVT.flag_rtcm_server=false
PVT.dump=true
PVT.dump_filename=/data/out/pvt.dat

; harness v2: receiver navigation filter on (real receivers filter their position output)
PVT.enable_pvt_kf=true
