# ASTRA Aircraft v1 — fine-grained military airframe classifier (MAR20).
#
# This is a YOLO **classification** model (yolo11n-cls), NOT a detector.
# It runs as stage 2 of the cascade: the DOTA-trained detector (astra-v1)
# emits 'aircraft-fixed-wing' boxes, we crop each box, this model returns
# one of 20 specific airframes (Su-35, F-22, B-52, ...).
#
# Launched via:
#     python train.py --config configs/astra-aircraft-v1.yaml
#
# Why these values:
# - yolo11n-cls.pt: 1.5M params, fits trivially on 6GB; cls is much cheaper
#   than detection (no anchor matcher, no NMS, no large GT tensor).
# - imgsz: 224 — Ultralytics' YOLO-cls default. Aircraft crops are typically
#   100-500px on a side; 224 is a sane resize target.
# - batch: 32 — cls runs comfortably at 32 on 6GB; bigger batches stabilise
#   per-class accuracy on 20-way fine-grained distinction.
# - epochs: 50 — MAR20 is small (~3.8k images, ~22k crops); cls converges
#   fast so we can afford the extra epochs.
# - val: true — unlike the DOTA detector run, classification val is cheap
#   (no assigner OOM risk) and we want the per-class accuracy report.

# ── Model & data ──────────────────────────────────────────────────────────
model: yolo11n-cls.pt
# data is a directory root for cls task (not a dataset.yaml).
# Folder layout produced by prepare_mar20.py: <data>/{train,val}/<class>/*.jpg
data: ${ASTRA_DATA_DIR}/datasets/mar20-cls

# ── Core schedule ─────────────────────────────────────────────────────────
epochs: 50
patience: 12
imgsz: 224
batch: 32
amp: true
cache: false
workers: 0                     # Windows quirk — same as the DOTA run
device: 0                      # RTX 4050
project: ${ASTRA_DATA_DIR}/runs
name: astra-aircraft-v1
exist_ok: false
seed: 42
deterministic: false

# ── Optimizer ─────────────────────────────────────────────────────────────
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
cos_lr: true

# ── Augmentation (cls-relevant subset) ────────────────────────────────────
# Rotations are valuable here — top-down aircraft can sit at any heading.
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.4
degrees: 180.0                 # full rotational symmetry for aerial crops
translate: 0.05
scale: 0.3
fliplr: 0.5
flipud: 0.5

# ── Validation / logging ──────────────────────────────────────────────────
val: true                      # cls val is cheap, keep it on
plots: true
save: true
save_period: 10
verbose: true
